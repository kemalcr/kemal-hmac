name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: fetch crystal version
        id: crystal-version
        run: echo "crystal=$(cat .crystal-version)" >> $GITHUB_OUTPUT

      - name: install crystal
        uses: crystal-lang/install-crystal@v1.9.1
        with:
          crystal: ${{ steps.crystal-version.outputs.crystal }}

      - name: bootstrap
        run: script/bootstrap --ci

      - name: test
        run: script/test

      - name: test non-default HMAC algorithm
        env:
          HMAC_ALGORITHM: SHA512
        run: |
          source script/setup-env
          crystal spec spec/kemal-hmac/client_spec.cr --exclude-warnings "$SHARDS_INSTALL_PATH" --example "uses the server's default algorithm"
